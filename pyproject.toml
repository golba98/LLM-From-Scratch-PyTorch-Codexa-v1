[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexa-workspace"
version = "0.2.0"
description = "Integration, evaluation and operator workflows for Codexa PyTorch"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = []

[project.scripts]
codexa = "codexa_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codexa_workspace*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
